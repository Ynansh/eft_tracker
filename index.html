<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квесты Таркова</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Квесты Таркова</h1>
    <a class="nav" href="items.html">Предметы →</a>
    <input id="search" type="search" placeholder="Поиск по квестам…" autocomplete="off">
    <div class="seg mode" role="group" aria-label="Режим игры">
      <button type="button" data-mode="pvp">PvP</button>
      <button type="button" data-mode="pve">PvE</button>
      <button type="button" data-mode="season">Сезон</button>
    </div>
    <div class="seg faction" role="group" aria-label="Фракция">
      <button type="button" data-faction="USEC">USEC</button>
      <button type="button" data-faction="BEAR">BEAR</button>
    </div>
    <div class="seg focus" role="group" aria-label="Фильтр Каппы">
      <button type="button" data-kappa="0">Все квесты</button>
      <button type="button" data-kappa="1">Только Каппа</button>
    </div>
    <div id="progress" class="progress"></div>
    <button id="reset" type="button" class="reset">Сброс</button>
  </header>

  <details class="profile" open>
    <summary id="profileSummary">Уровень и лояльность</summary>
    <div id="profileFields" class="profile-fields"></div>
  </details>

  <nav id="tabs" class="tabs"></nav>

  <main>
    <p id="hint" class="hint" hidden></p>
    <div id="groups"></div>
  </main>

  <footer id="done" class="done">
    <button id="doneToggle" type="button" class="done-bar"></button>
    <ul id="doneList" class="list done-list"></ul>
  </footer>

  <script src="quests.js"></script>
  <script src="story.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
