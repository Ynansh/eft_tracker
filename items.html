<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предметы — Tarkov трекер</title>
  <!-- Тема до отрисовки страницы, чтобы она не мигала при загрузке -->
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('eft-theme')) || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="items">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="scrim"></div>
  <div class="page">
    <header class="page-head">
      <div class="page-title">
        <h1>Предметы</h1>
        <div id="progress" class="progress"></div>
      </div>
      <div class="page-tools">
        <input id="search" type="search" placeholder="Поиск по предметам…" autocomplete="off" aria-label="Поиск по предметам">
        <button id="reset" type="button" class="reset">Сброс</button>
      </div>
    </header>
    <nav class="tabs toolbar">
      <div class="seg kind" role="group" aria-label="Для чего предметы">
        <button type="button" data-kind="quests">Для квестов</button>
        <button type="button" data-kind="hideout">Для убежища</button>
      </div>
      <div class="seg focus" role="group" aria-label="Фильтр Каппы">
        <button type="button" data-kappa="0">Все квесты</button>
        <button type="button" data-kappa="1">Каппа</button>
      </div>
    </nav>
    <main class="content">
      <details id="stations" class="stations panel" open>
        <summary>Уровни убежища: отметь построенные</summary>
        <div id="stationList" class="station-list"></div>
      </details>
      <ul id="items" class="items"></ul>
    </main>
  </div>
  <script src="data/quests.js"></script>
  <script src="data/items.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/items-page.js"></script>
</body>
</html>
